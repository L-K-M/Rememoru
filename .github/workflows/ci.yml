name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        run: |
          swift --version
          scripts/build.sh --clean

  app:
    name: App (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, test and bundle
        run: |
          swift --version
          scripts/build.sh --clean

      # Runners have a real WindowServer session; this exercises the
      # read-only paths and prints which private APIs resolve there. doctor
      # exits 1 without Accessibility; anything else (a crash) fails.
      - name: Smoke-test the app binary
        run: |
          app=dist/Rememoru.app/Contents/MacOS/Rememoru
          "$app" version
          "$app" doctor || [ $? -eq 1 ]
          "$app" list
          "$app" snapshot -o "$RUNNER_TEMP/layout.json"
          "$app" restore "$RUNNER_TEMP/layout.json" --dry-run
          "$app" dump > "$RUNNER_TEMP/dump.json"
          python3 -m json.tool "$RUNNER_TEMP/dump.json" > /dev/null

      # The runner's shell has Accessibility, so the mutating paths can run
      # for real: a frame restore, and a desktop created through Mission
      # Control plus a bridged move onto it.
      - name: End-to-end restore
        run: scripts/e2e-macos.sh
